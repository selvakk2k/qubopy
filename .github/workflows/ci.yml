name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run test suite with pytest
        run: |
          python -m pytest

      - name: Verify sdist package build and test suite
        run: |
          pip install build
          python -m build --sdist
          mkdir -p /tmp/sdist-test
          tar -xzf dist/qubopy-*.tar.gz -C /tmp/sdist-test
          cd /tmp/sdist-test/qubopy-*
          python -m pip install -e .[dev]
          python -m pytest
